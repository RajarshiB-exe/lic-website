<!DOCTYPE html>
<html>
<head>
<title>Inquiry</title>

<style>
body {
    font-family: Arial;
    background: #f4f7fb;
    animation: fadeIn 0.6s;
}

@keyframes fadeIn {
    from {opacity:0;}
    to {opacity:1;}
}

.container {
    max-width: 600px;
    margin: 60px auto;
    background: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
}

input, textarea {
    width: 90%;
    padding: 10px;
    margin: 10px;
}

button {
    background: #ffcc00;
    padding: 10px 20px;
    border: none;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #e6b800;
    transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">
    <h2>Send Inquiry</h2>

    <form action="https://formspree.io/f/mzdywbyl" method="POST">
        <input type="text" name="name" placeholder="Name" required><br>
        <input type="email" name="email" placeholder="Email" required><br>
        <textarea name="message">I am interested in LIC plans.</textarea><br>
        <button type="submit">Send</button>
    </form>

   <a href="index.html">← Back to Home</a>
</div>

</body>
</html>
